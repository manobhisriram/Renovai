name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Tests (unit, integration, evaluations; live-LLM evals are excluded)
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=70
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability scan (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml python-hcl2
      - name: Docker COPY paths, compose, workflows, Terraform syntax, env docs
        run: python scripts/verify_repo.py
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, load: true, tags: "renovai-backend:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, load: true, tags: "renovai-frontend:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Smoke test the backend image (mock AI, SQLite)
        run: |
          docker run -d --name smoke -p 8000:8000 -e APP_ENV=development -e LLM_PROVIDER=mock \
            -e DATABASE_URL=sqlite:////tmp/smoke.db -e GRAPH_CHECKPOINT_SQLITE_PATH=/tmp/ckpt.db -e QDRANT_LOCAL_PATH=/tmp/qd \
            -e UPLOAD_DIR=/tmp/up -e RUN_MIGRATIONS=true renovai-backend:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break || sleep 2; done
          curl -fs localhost:8000/ready
      - name: Scan images for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "renovai-backend:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
