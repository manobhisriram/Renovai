# Production-leaning overrides:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating reverse proxy / load balancer in front of the frontend container (see docs/deployment.md).
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  qdrant:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    ports: !reset []
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      APP_ENV: production
      RUN_MIGRATIONS: "true"
    deploy:
      resources:
        limits: { memory: 2g }
  frontend:
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
